<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoiseGuard — Ambiente</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    document.documentElement.setAttribute(
      'data-theme',
      localStorage.getItem('theme') || 'dark'
    );
  </script>
</head>
<body>
  <header class="header">
    <a class="header-logo" href="index.html">🔊 NoiseGuard</a>
    <div class="header-right">
      <div class="conn-pill">
        <span class="conn-dot" id="conn-dot"></span>
        <span id="conn-text">CONECTANDO...</span>
      </div>
      <button class="theme-btn" id="btn-theme" title="Alternar tema Dark / White">🌙</button>
    </div>
  </header>

  <main class="page">
    <a class="back-link" href="index.html">← Ambientes</a>

    <div class="page-head">
      <h1 class="page-title" id="env-title">Ambiente</h1>
      <p class="page-subtitle" id="env-type">Tipo: —</p>
    </div>

    <h2 class="section-title">Planta baixa</h2>
    <div class="floor-grid" id="floor-grid"><!-- preenchido por environment.js --></div>

    <div class="legend">
      <span class="legend-item"><span class="band-dot ok"></span>0–69 dB · Seguro</span>
      <span class="legend-item"><span class="band-dot warn"></span>70–84 dB · Moderado</span>
      <span class="legend-item"><span class="band-dot crit"></span>85+ dB · Crítico</span>
    </div>
  </main>

  <script type="module" src="js/header.js"></script>
  <script type="module" src="js/environment.js"></script>
</body>
</html>
